AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SIS 3 - ECR repository for the orders API image (immutable tags, scan on push,
  lifecycle policy). Deployed before the app stack so the image can be pushed first.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      # name is derived from the stack name, so a second copy (new stack name) never collides
      RepositoryName: !Sub "${AWS::StackName}-api"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true # delete-stack also removes the images
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "drop untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryName:
    Value: !Ref Repository
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
