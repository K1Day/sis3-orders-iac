AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SIS 3 - orders system. Container API (ECS Fargate behind an ALB) publishes a
  PaymentReceived domain event to SNS -> SQS queue (with DLQ) -> idempotent Lambda
  consumer -> DynamoDB. No hard-coded resource names: every copy of the stack is independent.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9-]{2,20}$"
    Description: Environment name, e.g. dev or defence (lowercase)
  ImageUri:
    Type: String
    Description: Full ECR image URI with an immutable tag (git SHA), set by deploy.sh
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
  LogRetentionDays:
    Type: Number
    Default: 3
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  # ------------------------------------------------------------------ network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-vpc" }
        - { Key: Env, Value: !Ref EnvName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-a" }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ------------------------------------------------------------------ security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTP from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks - port 8080 only from the ALB security group
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ------------------------------------------------------------------ load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip # Fargate (awsvpc) registers task IPs, not instances
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref Vpc
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ------------------------------------------------------------------ messaging (week 9)
  PaymentEventsTopic:
    Type: AWS::SNS::Topic

  PaymentsDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days, longer than the source queue
      SqsManagedSseEnabled: true

  PaymentsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 200 # >= 6 x 30 s function timeout + 5 s batch window
      MessageRetentionPeriod: 345600 # 4 days
      ReceiveMessageWaitTimeSeconds: 20 # long polling
      SqsManagedSseEnabled: true # SSE-SQS, not the aws/sqs KMS key (SNS can deliver)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PaymentsDlq.Arn
        maxReceiveCount: 5

  PaymentsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref PaymentsQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt PaymentsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref PaymentEventsTopic

  PaymentsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PaymentEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt PaymentsQueue.Arn
      RawMessageDelivery: true

  # ------------------------------------------------------------------ data
  ProcessedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  # ------------------------------------------------------------------ logs
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------ idempotent consumer
  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: consumer-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt PaymentsQueue.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: [!GetAtt ProcessedTable.Arn, !GetAtt AccountsTable.Arn]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ConsumerLogGroup.Arn

  ConsumerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt ConsumerRole.Arn
      Timeout: 30
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref ConsumerLogGroup
        LogFormat: Text
      Environment:
        Variables:
          PROCESSED_TABLE: !Ref ProcessedTable
          ACCOUNTS_TABLE: !Ref AccountsTable
      Code:
        ZipFile: |
          import json, os, time
          import boto3

          ddb = boto3.client("dynamodb")
          PROCESSED_TABLE = os.environ["PROCESSED_TABLE"]
          ACCOUNTS_TABLE = os.environ["ACCOUNTS_TABLE"]
          TTL_SECONDS = 7 * 24 * 3600


          def is_duplicate(err):
              reasons = err.response.get("CancellationReasons", [])
              return any(r.get("Code") == "ConditionalCheckFailed" for r in reasons)


          def lambda_handler(event, context):
              failed = []
              for record in event["Records"]:
                  msg_id = record["messageId"]
                  payment_id = None
                  try:
                      body = json.loads(record["body"])
                      if body.get("poison"):
                          raise ValueError("poison message (DLQ test)")
                      # idempotency key = business key paymentId, not the SQS messageId
                      payment_id = str(body["paymentId"])
                      ddb.transact_write_items(TransactItems=[
                          {"Put": {
                              "TableName": PROCESSED_TABLE,
                              "Item": {"pk": {"S": payment_id},
                                       "expiresAt": {"N": str(int(time.time()) + TTL_SECONDS)}},
                              "ConditionExpression": "attribute_not_exists(pk)"}},
                          {"Update": {
                              "TableName": ACCOUNTS_TABLE,
                              "Key": {"id": {"S": str(body["account"])}},
                              "UpdateExpression": "ADD balance :a",
                              "ExpressionAttributeValues": {":a": {"N": str(body["amount"])}}}},
                      ])
                      print(json.dumps({"result": "PROCESSED", "paymentId": payment_id, "messageId": msg_id}))
                  except ddb.exceptions.TransactionCanceledException as err:
                      if is_duplicate(err):
                          print(json.dumps({"result": "DUPLICATE_SKIPPED", "paymentId": payment_id, "messageId": msg_id}))
                      else:
                          print(json.dumps({"result": "FAILED", "error": str(err), "messageId": msg_id}))
                          failed.append({"itemIdentifier": msg_id})
                  except Exception as err:
                      print(json.dumps({"result": "FAILED", "error": str(err), "messageId": msg_id}))
                      failed.append({"itemIdentifier": msg_id})
              return {"batchItemFailures": failed}

  ConsumerTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt PaymentsQueue.Arn
      FunctionName: !Ref ConsumerFunction
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 2

  # ------------------------------------------------------------------ container (week 10)
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Used by ECS to pull the image from ECR and write logs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Used by the application code - may only publish to this stack's topic
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-payment-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref PaymentEventsTopic

  Cluster:
    Type: AWS::ECS::Cluster

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - Name: TOPIC_ARN
              Value: !Ref PaymentEventsTopic
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: APP_VERSION
              Value: !Select [1, !Split [":", !Ref ImageUri]]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # lab shortcut from slide 24: no NAT gateway
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup] # the task SG, not the ALB SG
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ServiceUrl:
    Description: Open in a browser; POST /payments publishes a domain event
    Value: !Sub "http://${LoadBalancer.DNSName}/"
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TargetGroupArn:
    Value: !Ref TargetGroup
  TopicArn:
    Value: !Ref PaymentEventsTopic
  QueueUrl:
    Value: !Ref PaymentsQueue
  DlqUrl:
    Value: !Ref PaymentsDlq
  ProcessedTableName:
    Value: !Ref ProcessedTable
  AccountsTableName:
    Value: !Ref AccountsTable
  ApiLogGroupName:
    Value: !Ref ApiLogGroup
  ConsumerLogGroupName:
    Value: !Ref ConsumerLogGroup
